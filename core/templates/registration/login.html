{% extends "core/base.html" %}

{% block title %}Log in | LifeOps{% endblock %}

{% block content %}
<section class="auth-shell">
  <form class="auth-card" method="post">
    {% csrf_token %}
    <p class="eyebrow">Secure workspace</p>
    <h1>Log in</h1>
    {% if form.errors %}
      <p class="form-error">Check your username and password, then try again.</p>
    {% endif %}
    <label>
      Username
      {{ form.username }}
    </label>
    <label>
      Password
      {{ form.password }}
    </label>
    <button class="button" type="submit">Log in</button>
    <a class="demo-link" href="{% url 'demo_login' %}">Use the demo account instead</a>
  </form>
</section>
{% endblock %}
