{% extends 'core/base.html' %}{% block content %}<div class="narrow"><div class="page-heading"><div><span class="eyebrow">Account</span><h1>Profile settings</h1><p>Control the basic information shown inside your LifeOps workspace.</p></div></div><div class="panel form-panel"><form method="post">{% csrf_token %}<div class="field"><label>Display name</label><input name="display_name" value="{{ profile.display_name }}" maxlength="120"></div><div class="field"><label>Role / description</label><input name="role" value="{{ profile.role }}" maxlength="120" placeholder="Student, IT technician, household admin…"></div><div class="field"><label>Email</label><input type="email" name="email" value="{{ user.email }}"></div><div class="form-actions"><button class="btn primary">Save profile</button><a class="btn ghost" href="{% url 'dashboard' %}">Back</a></div></form></div></div>{% endblock %}
